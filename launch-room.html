<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Launch Room · Nat Habit</title>
<meta name="description" content="Round 2 assignment for the Sr Category Growth Associate role at Nat Habit. Take one product from idea to day 30 in about 1 hour 45 minutes.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centred game column, sticky HUD on top, each screen is a card that swaps in place. */
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#faf7f4; --field:#ffffff; --line:#ebe4dc;
  --fg:#1f1b18; --muted:#6f6760; --accent:#b4532a; --accent-soft:#f8ece5; --accent-ink:#ffffff;
  --warn:#b4532a; --ok:#3f7d4f;
  --display:"Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
  --body:"Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);min-height:100vh;font-variant-numeric:tabular-nums}
.r{color:var(--accent)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
/* HUD */
.hud{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.brand{font:600 15px/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:500 11px/1.3 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pips{display:flex;gap:5px;flex:1;justify-content:center;min-width:0}
.pip{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pip.done{background:var(--fg)} .pip.now{background:var(--accent)}
.xp{font:600 13px/1 var(--display);color:var(--accent);white-space:nowrap}
.xp span{color:var(--muted);font-weight:500}
/* type */
h1{font:700 clamp(42px,8.5vw,76px)/1 var(--display);letter-spacing:-.035em;margin:10px 0 14px;text-wrap:balance}
h2{font:600 clamp(24px,4.6vw,32px)/1.15 var(--display);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h3{font:600 18px/1.3 var(--display);margin:0 0 6px}
p{margin:0 0 12px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--fg);background:var(--panel2)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);min-width:0}
.lv b{display:block;font:600 15px/1.25 var(--display)}
.lv .n{font:600 11.5px/1 var(--display);letter-spacing:.08em;color:var(--accent)}
.lv .t{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.counter{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.counter .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(180,83,42,.15);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(180,83,42,0)}}
.counter b{color:var(--fg);font-family:var(--mono)}
/* buttons */
.btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 15px/1 var(--display);padding:15px 24px;letter-spacing:.01em;cursor:pointer;transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,.mv:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=url],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:16px/1.45 var(--body);padding:11px 12px}
textarea{resize:vertical;min-height:120px}
input::placeholder,textarea::placeholder{color:#a89f97}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;font-weight:600;background:var(--field)}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.file{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--field)}
.file.has{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.flag{border-left:3px solid var(--warn);background:var(--accent-soft);padding:10px 12px;border-radius:8px;font-size:14px}
.err{color:var(--warn);font-size:13px;min-height:1em}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.consent input{margin-top:4px;accent-color:var(--accent)}
/* game */
.timerbar{display:flex;align-items:center;gap:12px}
.track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);width:100%;transition:width 1s linear}
.timerbar.low .fill{background:var(--warn)}
.clock{font:600 20px/1 var(--display);min-width:64px;text-align:right}
.timerbar.low .clock{color:var(--warn)}
.q{font:600 19px/1.45 var(--body)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:14px 16px;font:600 16px/1.35 var(--body);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{font:600 13px/1 var(--display);color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.ideas{font:600 15px/1 var(--display);color:var(--accent)}
.pop{position:fixed;right:20px;top:64px;font:700 20px/1 var(--display);color:var(--accent);pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
.bets{display:flex;flex-direction:column;gap:8px}
.bet{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px}
.bet .rk{font:700 22px/1 var(--display);color:var(--accent);min-width:26px}
.bet .tx{flex:1;min-width:0;font-size:14.5px}
.bet .tx b{display:block;font-size:15px;margin-bottom:2px}
.mvs{display:flex;flex-direction:column;gap:4px}
.mv{appearance:none;width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer;font-size:14px}
.mv:disabled{opacity:.3;cursor:default}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 12px/1.3 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--panel2)}
tr:last-child td{border-bottom:0}
@media (max-width:560px){
  .tbl{border:0;overflow:visible}
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 0;background:var(--panel)}
  td{display:flex;justify-content:space-between;gap:12px;border-bottom:0;padding:6px 14px;text-align:right}
  td::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left}
  td:first-child{font-weight:600;color:var(--accent);text-align:left}
  td:first-child::before{content:none}
}
.wc{font:500 12px/1 var(--mono);color:var(--muted);text-align:right}
.wc.over{color:var(--warn)}
.mine{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:180px;overflow:auto;font-size:14px;white-space:pre-wrap;color:var(--muted)}
.big{font:700 clamp(52px,13vw,100px)/1 var(--display);letter-spacing:-.04em;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font:600 26px/1 var(--display);margin-bottom:6px}
.stat span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--warn);color:#fff;font:600 14px/1.3 var(--body);padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.breath{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.75}}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center}
.fade{animation:in .35s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* additions for The Launch Room */
select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:15px/1.3 var(--body);padding:10px 10px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dossier-btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:999px;font:600 13px/1 var(--display);padding:9px 13px;cursor:pointer;white-space:nowrap}
.dossier-btn:hover{border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(31,27,24,.45);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow:auto}
.sheet{background:var(--panel);border-radius:14px;max-width:820px;width:100%;padding:20px;position:relative}
.sheet .x{position:sticky;top:0;float:right;appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}
.ds h3{margin-top:18px}
.ds ul{margin:0 0 10px;padding-left:20px}
.ds li{margin:3px 0}
.quote{border-left:3px solid var(--accent);padding:6px 12px;background:var(--panel2);border-radius:6px;margin:6px 0;font-size:14.5px}
.quote span{display:block;color:var(--muted);font-size:12.5px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.qgrid{grid-template-columns:1fr}}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px}
.sum.bad{border-color:var(--warn);color:var(--warn)}
.sum.good{border-color:var(--ok);color:var(--ok)}
.plan td input,.plan td select{min-width:0}
.plan td{vertical-align:middle}
.plan input[type=number]{padding:8px 10px;max-width:130px;margin-left:auto;display:block}
.task{display:grid;grid-template-columns:1fr 170px 120px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.task b{font-size:15px;display:block}
.task span{font-size:13px;color:var(--muted)}
@media (max-width:620px){.task{grid-template-columns:1fr 1fr}.task>div:first-child{grid-column:1/-1}}
.boss{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:16px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:700 20px/1 var(--display)}
.boss .who{font:600 15px/1.2 var(--display)}
.boss .who span{display:block;font:500 12.5px/1.4 var(--body);color:var(--muted)}
.boss .said{font:600 17px/1.5 var(--body);margin-top:8px}
.myplan{font-size:14px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.myplan b{color:var(--fg)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--display);text-align:center}
.alert{border:1px solid var(--warn);border-radius:12px;padding:12px 14px;background:#fff;font-size:14.5px}
.alert b{color:var(--warn)}
.pl td:nth-child(3){font-weight:600}
</style>
</head>

<div class="hud"><div class="hud-in">
  <div class="brand">The Launch <span class="r">Room.</span><small>Nat Habit · Round 2</small></div>

<script>

const DOSSIER = `

<h2>Brightwell Anti-Dandruff <span class="r">Shampoo.</span></h2>
<p class="muted small">A made-up brand and made-up numbers. Everything you need is on this page.</p>

<h3>1. The brand</h3>

/* ======= TIMER ======= */
function timer(sec, onEnd){
  clearInterval(TIMER);
  const bar=$("#tb"), fill=$("#tf"), clk=$("#tc");
  const end=Date.now()+sec*1000;
  const tick=()=>{
    const left=Math.max(0, Math.round((end-Date.now())/1000));
    clk.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    fill.style.width=(left/sec*100)+"%";
    bar.classList.toggle("low", left<=Math.min(60, sec*0.15));
    if(left===60 && sec>120) toast("1 minute left on this level.");
    if(left<=0){clearInterval(TIMER); onEnd();}
  };
  tick(); TIMER=setInterval(tick,1000);
}

function priceCheck(){
  const m=num(S.a.p_l); if(!m) return "No 340 ml MRP given";
  const sp=m*0.8, net=sp/(1+GST), gm=(net-COST.l)/net, maxd=1-(COST.l/(1-GM_FLOOR))*(1+GST)/m;
  const ok=(given,exp,tol)=>{const g=num(given); if(g==null) return "blank"; return Math.abs(g-exp)<=tol?"ok":"off";};
  const ms=num(S.a.p_s), gmS = ms ? ((ms*0.8/(1+GST))-COST.s)/(ms*0.8/(1+GST)) : null;
  return `Expected at MRP ₹${m}: SP ${inr(sp)} (${ok(S.a.p_sp,sp,2)}), net ${inr(net)} (${ok(S.a.p_net,net,2)}), GM ${pct(gm)} (${ok(S.a.p_gm,gm*100,2)}), max discount ${pct(maxd)} (${ok(S.a.p_max,maxd*100,2)}).${gmS!=null?` 180 ml GM at 20% off: ${pct(gmS)}${gmS<GM_FLOOR?" (below 60% floor)":""}.`:""}`;
}

/* L3 Plan the year */
function l3(){
  const lv=LV("L3");
  const plan=S.a.plan||(S.a.plan={}); const mk=S.a.mk||(S.a.mk={});
  const months=["Month 1","Month 2","Month 3","Month 6","Not in year 1"];
  shell(lv, `<div class="card stack">
    <div class="q">Spread the ₹18 Cr (1,800 lakh) year 1 goal across channels, and decide when each one goes live.</div>
    <div class="tbl plan"><table><thead><tr><th>Channel</th><th>Goes live</th><th>Year 1 sales (₹ lakh)</th></tr></thead><tbody>
      ${CHANNELS.map(c=>`<tr><td>${c.n}</td><td data-l="Goes live"><select id="m_${c.k}">${months.map(m=>`<option ${((plan[c.k]||{}).m||"Month 1")===m?"selected":""}>${m}</option>`).join("")}</select></td><td data-l="₹ lakh"><input id="v_${c.k}" type="number" min="0" inputmode="decimal" value="${esc((plan[c.k]||{}).v??"")}"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="sum" id="psum"></div>
    <div class="q" style="margin-top:6px">Now split the first 3 months of marketing: ₹1.2 Cr (120 lakh).</div>
    <div class="tbl plan"><table><thead><tr><th>Where</th><th>₹ lakh</th></tr></thead><tbody>
      ${MKT.map(x=>`<tr><td>${x.n}</td><td data-l="₹ lakh"><input id="k_${x.k}" type="number" min="0" inputmode="decimal" value="${esc(mk[x.k]??"")}"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="sum" id="msum"></div>
    <label class="f">Why this order of launch, and this split? What are you betting on?${ta("c_why",5,100)}</label>
    <label class="f">How many bottles a month do you expect to sell by month 3, all channels? Show a quick working.${ta("c_units",3,50,"e.g. 25,000 a month because…")}</label>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="fin">Submit</button></div></div>`);
  const upd=()=>{
    let t=0; CHANNELS.forEach(c=>{ const v=num($("#v_"+c.k).value); plan[c.k]={m:$("#m_"+c.k).value, v:v}; t+=v||0; });
    const ps=$("#psum"); ps.innerHTML=`<span>Total</span><span>${t.toLocaleString("en-IN")} of 1,800 lakh</span>`; ps.className="sum "+(Math.abs(t-TARGET_L)<1?"good":t>0?"bad":"");
    let m=0; MKT.forEach(x=>{ const v=num($("#k_"+x.k).value); mk[x.k]=v; m+=v||0; });
    const ms=$("#msum"); ms.innerHTML=`<span>Total</span><span>${m.toLocaleString("en-IN")} of 120 lakh</span>`; ms.className="sum "+(Math.abs(m-MKT_L)<0.5?"good":m>0?"bad":"");
    save();
  };
  app.querySelectorAll("select,input[type=number]").forEach(el=>el.addEventListener("input",upd)); upd();
  [["c_why",100],["c_units",50]].forEach(([id,mx])=>wc($("#"+id),$("#"+id+"_w"),mx)); bindText(["c_why","c_units"]);
  const end=()=>{ upd();
    const pt=CHANNELS.reduce((a,c)=>a+((plan[c.k]||{}).v||0),0), mt=MKT.reduce((a,x)=>a+(mk[x.k]||0),0);
    next("L3",{"L3 Channel plan":CHANNELS.map(c=>`${c.n}: ${(plan[c.k]||{}).v??"–"}L, ${(plan[c.k]||{}).m||"–"}`).join("\n"),"L3 Plan total (L)":pt,"L3 Marketing split":MKT.map(x=>`${x.n}: ${mk[x.k]??"–"}L`).join("\n")+`\nTotal: ${mt}L`,"L3 Why":S.a.c_why||"","L3 Month-3 bottles":S.a.c_units||""}); };
  $("#fin").onclick=end; timer(remain(lv.id, lv.min*60),end);
}

/* L4 Run the launch */
function l4(){
  const lv=LV("L4");
  const sch=S.a.sch||(S.a.sch={});
  shell(lv, `<div class="card stack">
    <div class="q">Launch day is W0, 12 weeks away. For each task, pick who owns it and the week it is <i>done</i>. The case file (section 9) has the lead times.</div>
    ${TASKS.map(t=>`<div class="task"><div><b>${t.t}</b><span>${t.d}</span></div>
      <select id="o_${t.k}" aria-label="Owner for ${esc(t.t)}"><option value="">Owner…</option>${OWNERS.map(o=>`<option ${(sch[t.k]||{}).o===o?"selected":""}>${o}</option>`).join("")}</select>
      <select id="w_${t.k}" aria-label="Week done for ${esc(t.t)}"><option value="">Week…</option>${WEEKS.map(w=>`<option ${(sch[t.k]||{}).w===w?"selected":""}>${w}</option>`).join("")}</select></div>`).join("")}
    <label class="f"><span>The two biggest risks to launching on W0, and what you would do about each <b>this week</b>.</span>${ta("x_risk",5,100)}</label>
    <label class="f">The one thing you would personally chase every single day until launch, and why.${ta("x_chase",2,40)}</label>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="fin">Submit</button></div></div>`);
  const upd=()=>{ TASKS.forEach(t=>{ sch[t.k]={o:$("#o_"+t.k).value, w:$("#w_"+t.k).value}; }); save(); };
  app.querySelectorAll(".task select").forEach(el=>el.addEventListener("change",upd));
  [["x_risk",100],["x_chase",40]].forEach(([id,m])=>wc($("#"+id),$("#"+id+"_w"),m)); bindText(["x_risk","x_chase"]);
  const end=()=>{ upd(); next("L4",{"L4 Schedule":TASKS.map(t=>`${t.t}: ${(sch[t.k]||{}).o||"–"}, ${(sch[t.k]||{}).w||"–"}`).join("\n"),"L4 Risks":S.a.x_risk||"","L4 Daily chase":S.a.x_chase||"","L4 Auto-check":scheduleCheck()}); };
  $("#fin").onclick=end; timer(remain(lv.id, lv.min*60),end);
}
function scheduleCheck(){
  const sch=S.a.sch||{}; const w=k=>{const v=(sch[k]||{}).w; if(!v) return null; const m=v.match(/W([+-]?\d+)/); return m?parseInt(m[1],10):null;};
  const issues=[]; const W={}; TASKS.forEach(t=>W[t.k]=w(t.k));
  const blank=TASKS.filter(t=>W[t.k]==null).length; if(blank) issues.push(`${blank} task(s) without a week`);
  if(W.stab!=null && W.stab<-4) issues.push("stability done before W-4 (impossible, 8 weeks from W-12)");
  if(W.art!=null && W.pko!=null && W.art>W.pko) issues.push("packaging ordered before artwork is final");
  if(W.pko!=null && W.pko>-10) issues.push("packaging ordered after W-10, so launch at W0 is not possible");
  if(W.prod!=null && W.pko!=null && W.prod<W.pko+9) issues.push("production done less than 9 weeks after packaging order");
  if(W.prod!=null && W.stab!=null && W.prod<W.stab) issues.push("production before stability sign-off");
  if(W.stock!=null && W.prod!=null && W.stock<W.prod+1) issues.push("stock in warehouses before production + 1 week");
  if(W.list!=null && W.price!=null && W.list<W.price) issues.push("listings live before prices approved");
  if(W.list!=null && W.stock!=null && W.list<W.stock-1) issues.push("listings live well before stock");
  if(W.seed!=null && W.seed>-3) issues.push("creator kits later than W-3, so no posts at launch");
  if(W.seed!=null && W.prod!=null && W.seed<W.prod) issues.push("creator kits before first production (needs a pilot batch: did they say so?)");
  if(W.mt!=null && W.mt<-4) issues.push("trade done before W-4 (8 weeks from W-12)");
  if(W.stock!=null && W.stock>0) issues.push("stock lands after launch day");
  const wrongOwner=TASKS.filter(t=>(sch[t.k]||{}).o && sch[t.k].o!==KEYOWN[t.k]).map(t=>`${t.k}: ${sch[t.k].o}`);
  return `${issues.length? issues.length+" timing issue(s): "+issues.join("; ") : "Timing consistent"}. Owners differing from key: ${wrongOwner.length?wrongOwner.join(", "):"none"}.`;
}

/* L5 Defend it */
function challenger(){
  const plan=S.a.plan||{}, mk=S.a.mk||{}; const tot=CHANNELS.reduce((a,c)=>a+((plan[c.k]||{}).v||0),0)||1;
  const sh=k=>((plan[k]||{}).v||0)/tot; const m340=num(S.a.p_l)||0; const mkt=MKT.reduce((a,x)=>a+(mk[x.k]||0),0)||1;
  const aw=((mk.aw||0))/mkt;
  const cands=[];
  if(m340>=349) cands.push({score:(m340-349)/50+1, who:"Neha Arora", role:"Head of Performance Marketing", ini:"NA",
    said:`₹${m340} for 340 ml from a brand nobody trusts for dandruff, with zero reviews? ClearCo has 4.2 stars and ten years. Drop the price by 20% or give me 40% off for launch, or my ad money just burns.`});
  if(sh("qc")<0.15) cands.push({score:(0.15-sh("qc"))*10+1, who:"Kabir Sethi", role:"Head of Quick Commerce", ini:"KS",
    said:`You've given quick commerce only ${Math.round(sh("qc")*100)}% of the year. It grows 10% a month, and dandruff itch is a buy-it-tonight problem. This plan is built for 2019, not for how metros buy now.`});
  if(sh("mt")<0.25) cands.push({score:(0.25-sh("mt"))*8+1, who:"Rajeev Malhotra", role:"National Sales Head, trade", ini:"RM",
    said:`78% of anti-dandruff shampoo is bought in shops, and you've given trade only ${Math.round(sh("mt")*100)}%. An online-only launch is a vanity launch. You will never reach ₹18 Cr from screens.`});
  if(aw>0.4) cands.push({score:(aw-0.4)*10+1, who:"Priya Nair", role:"Finance Controller", ini:"PN",
    said:`₹${mk.aw} lakh on awareness for a brand-new product with no reviews? Show me the payback in rupees, or I'm cutting that line in half before it goes to the founder.`});
  if(!cands.length) cands.push({score:1, who:"Neha Arora", role:"Head of Performance Marketing", ini:"NA",
    said:`A gentle anti-dandruff shampoo is a weak story. Everyone says gentle. Nobody searches for it, and it won't win a single click against ClearCo. Give me one sharp reason to buy or don't launch.`});
  return cands.sort((a,b)=>b.score-a.score)[0];
}
function l5(){
  const lv=LV("L5");
  if(!S.a.boss){ S.a.boss=challenger(); save(); }
  const b=S.a.boss, plan=S.a.plan||{};
  const planLine=`MRP ₹${esc(S.a.p_s||"–")} / ₹${esc(S.a.p_l||"–")} · Channels: ${CHANNELS.map(c=>`${c.n} ${(plan[c.k]||{}).v??"–"}L`).join(", ")}`;
  const boss=`<div class="boss"><div class="avatar" aria-hidden="true">${b.ini}</div><div><div class="who">${b.who}<span>${b.role} · in your launch review</span></div><div class="said">"${esc(b.said)}"</div></div></div>`;
  if(S.l5stage!=="video"){
    shell(lv, `${boss}<div class="myplan"><b>Your plan so far:</b> ${planLine}</div>
      <div class="card stack"><div class="q">You have 4 minutes to prepare. Jot down your reply: what you agree with, where you push back, and the one number or fact that backs you up.</div>
      ${ta("d_notes",6,80,"Agree: …\nPush back: …\nProof: …\nSo I propose: …")}
      <div class="row" style="justify-content:flex-end"><button class="btn" id="fin">I'm ready to record</button></div></div>`);
    wc($("#d_notes"),$("#d_notes_w"),80); bindText(["d_notes"]);
    const end=()=>{ S.l5stage="video"; S.l5vStart=Date.now(); save(); l5(); };
    $("#fin").onclick=end; timer(remain("L5n",4*60),end); return;
  }
  const left=remain("L5v",10*60);
  shell(lv, `${boss}
    <div class="card stack"><div class="q">Now record your reply on your phone: <b>30 seconds</b>, face to camera, talking to ${esc(b.who.split(" ")[0])}. No slides, no script reading.</div>
    <ol class="steps">
      <li><span>Record a selfie video of 30 seconds or less. Start by saying your name.</span></li>
      <li><span>Upload it as <b>unlisted</b> on YouTube, or to Google Drive or Loom with "anyone with the link can view".</span></li>
      <li><span>Paste the link below. This is the only box where pasting works.</span></li>
    </ol>
    <div class="myplan"><b>Your notes:</b><br>${esc(S.a.d_notes||"(none)").replace(/\n/g,"<br>")}</div>
    <label class="f">Video link<input id="vid" type="url" placeholder="https://youtu.be/…  or  https://drive.google.com/…" value="${esc(S.a.vid||"")}" autocomplete="off"></label>
    <div class="err" id="verr" role="alert"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="fin">Submit video</button></div></div>`);
  $("#vid").addEventListener("input",()=>{S.a.vid=$("#vid").value.trim(); save();});
  const okUrl=u=>/^https?:\/\/(www\.)?(youtube\.com|youtu\.be|m\.youtube\.com|drive\.google\.com|loom\.com)\//i.test(u);
  const end=(timeout)=>{ const u=($("#vid").value||"").trim();
    if(!timeout && !okUrl(u)){ $("#verr").textContent="Please paste a YouTube, Google Drive or Loom link."; return; }
    S.l5stage="done"; save();
    next("L5",{"L5 Challenger":`${b.who}, ${b.role}: ${b.said}`,"L5 Prep notes":S.a.d_notes||"","L5 Video link":u||"(no link)"}); };
  $("#fin").onclick=()=>end(false); timer(left,()=>end(true));
}

/* L6 Fire drill */
function l6(){
  const lv=LV("L6");
  if(!S.a.fireOrder) S.a.fireOrder=FIRES.map(f=>f.k);
  shell(lv, `<div class="card stack">
    <div class="q">Week 3 after launch. Here's the dashboard (₹ lakh):</div>
    <div class="tbl"><table><thead><tr><th>Channel</th><th>Plan</th><th>Actual</th><th>What's happening</th></tr></thead>
    <tbody>${WEEK3.map(r=>`<tr><td>${r[0]}</td><td data-l="Plan">${r[1]}</td><td data-l="Actual">${r[2]}</td><td data-l="Note">${r[3]}</td></tr>`).join("")}</tbody></table></div>
    <div class="q">Rank the four fires: the one you attack first goes on top.</div>
    <div class="bets" id="fires"></div>
    <label class="f">For your top two: the first thing you do today, who you call, and the number that tells you it's fixed.${ta("f_plan",6,120,"#1 … today I… I call… fixed when…\n#2 …")}</label>
    <div class="alert"><b>WhatsApp from the founder:</b> "We're 25% behind. Let's run 30% off on the website and all marketplaces this weekend to catch up."</div>
    <label class="f">Your reply to the founder. Write it the way you'd actually send it.${ta("f_reply",4,80)}</label>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="fin">Submit</button></div></div>`);
  const draw=()=>{ const o=S.a.fireOrder;
    $("#fires").innerHTML=o.map((k,i)=>{const f=FIRES.find(x=>x.k===k); return `<div class="bet"><div class="rk">${i+1}</div><div class="tx"><b>${f.t}</b><span class="muted">${f.d}</span></div><div class="mvs"><button class="mv" data-i="${i}" data-d="-1" aria-label="Move up" ${i===0?"disabled":""}>▲</button><button class="mv" data-i="${i}" data-d="1" aria-label="Move down" ${i===o.length-1?"disabled":""}>▼</button></div></div>`}).join("");
    $("#fires").querySelectorAll(".mv").forEach(m=>m.onclick=()=>{const i=+m.dataset.i,j=i+ +m.dataset.d; [o[i],o[j]]=[o[j],o[i]]; save(); draw();});
  };
  draw();
  [["f_plan",120],["f_reply",80]].forEach(([id,m])=>wc($("#"+id),$("#"+id+"_w"),m)); bindText(["f_plan","f_reply"]);
  const end=()=>next("L6",{"L6 Fire order":S.a.fireOrder.map((k,i)=>`${i+1}. ${FIRES.find(f=>f.k===k).t}`).join("\n"),"L6 Top-two plan":S.a.f_plan||"","L6 Founder reply":S.a.f_reply||""});
  $("#fin").onclick=end; timer(remain(lv.id, lv.min*60),end);
}

/* L7 Day 30 */
function l7(){
  const lv=LV("L7");
  shell(lv, `<div class="card stack">
    <div class="q">Month 1 is done. Plan against actual:</div>
    <div class="tbl pl"><table><thead><tr><th>Line</th><th>Plan</th><th>Actual</th></tr></thead>
    <tbody>${PL.map(r=>`<tr><td>${r[0]}</td><td data-l="Plan">${r[1]}</td><td data-l="Actual">${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <label class="f">TL;DR for the founder: what happened, in two lines.${ta("r_tldr",3,50)}</label>
    <label class="f">One gross margin lever, with a rough ₹ impact per month.${ta("r_gm",3,50)}</label>
    <label class="f">Your three actions for month 2, each with an owner.${ta("r_next",4,70,"1. … (owner)\n2. …\n3. …")}</label>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="fin">Submit and finish</button></div></div>`);
  [["r_tldr",50],["r_gm",50],["r_next",70]].forEach(([id,m])=>wc($("#"+id),$("#"+id+"_w"),m)); bindText(["r_tldr","r_gm","r_next"]);
  const end=()=>{ endLevel("L7"); S.step="done"; save(); render(); };
  $("#fin").onclick=end; timer(remain(lv.id, lv.min*60),end);
}

/* ======= FINISH ======= */
function charsTyped(){
  const a=S.a; const skip=new Set(["vid","plan","mk","sch","boss","fireOrder"]);
  return Object.keys(a).filter(k=>!skip.has(k)&&typeof a[k]==="string").map(k=>a[k]).join("").replace(/\s/g,"").length;
}
function finalFields(){
  const a=S.a;
  return {"L7 TL;DR":a.r_tldr||"","L7 GM lever":a.r_gm||"","L7 Month-2 actions":a.r_next||"",
    "Total minutes":S.t0?Math.round((Date.now()-S.t0)/60000):0,
    "Minutes per level":LEVELS.map(l=>`${l.id} ${S.lvT[l.id]!=null?Math.round(S.lvT[l.id]/6)/10:"–"}/${l.min}`).join(", "),
    "Tab switches":S.tabs,"Paste attempts":S.pastes,"Reloads":S.reloads,"Case file opens":S.dossierOpens||0,
    "Keys vs chars":`${S.keys||0} keys / ${charsTyped()} chars`};
}
function done(){
  hud();
  const mins=S.t0?Math.round((Date.now()-S.t0)/60000):0;
  app.innerHTML=`<div class="stack fade" style="padding-top:12px">
    <div class="eyebrow">Launch complete</div>
    <h2 style="font-size:clamp(30px,6vw,44px)">That's a wrap, <span class="r">${esc((S.profile.name||"").split(" ")[0]||"friend")}</span>.</h2>
    <div class="stats"><div class="stat"><b>${LEVELS.length}/${LEVELS.length}</b><span>levels done</span></div><div class="stat"><b>${mins}m</b><span>time taken</span></div><div class="stat"><b>${S.a.vid?"1":"0"}</b><span>video sent</span></div></div>
    <div class="card" id="sv"><p style="margin:0" class="muted" id="svt">Saving your answers…</p></div>
    <div class="card stack small"><h3>What happens next</h3><p class="muted" style="margin:0">Tanu reads every answer and watches every video. If we move ahead, the next conversation starts from your plan here, so remember why you made each call.</p></div>
  </div>`;
  if(S.sent){ $("#svt").textContent="Your answers are in. Thank you for your time."; return; }
  const trySend=async()=>{
    $("#svt").textContent="Saving your answers…";
    try{const j=await post({action:"finish", id:S.id, fields:finalFields()}); if(!j.ok) throw 0; S.sent=true; save(); $("#svt").textContent="Your answers are in. Thank you for your time.";}
    catch(e){ $("#sv").innerHTML=`<p class="muted" style="margin:0 0 10px">We couldn't save your answers yet. They're kept on this device, so nothing is lost.</p><button class="btn" id="rt">Try again</button>`; $("#rt").onclick=()=>{ $("#sv").innerHTML='<p style="margin:0" class="muted" id="svt"></p>'; trySend(); }; }
  };
  trySend();
}

/* ======= BOOT ======= */
(function boot(){
  if(S.levelLive){ S.reloads++; S.levelLive=false; save(); }
  render();
})();
</script>
